<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Agrisens</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f5f7fb; }
        
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100%;
            background: #1a472a;
            color: white;
            padding: 2rem 1rem;
        }
        
        .sidebar .logo {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .sidebar nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #e5e7eb;
            text-decoration: none;
            border-radius: 12px;
            margin-bottom: 8px;
            transition: all 0.3s;
        }
        
        .sidebar nav a:hover, .sidebar nav a.active {
            background: #2d6a4f;
            color: white;
        }
        
        .sidebar nav a i { width: 24px; }
        
        .main-content {
            margin-left: 260px;
            padding: 2rem;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: white;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .logout-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 { font-size: 0.9rem; color: #6b7280; margin-bottom: 0.5rem; }
        .stat-card .value { font-size: 2rem; font-weight: 700; color: #1a472a; }
        
        .action-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        
        .btn-primary { background: #1a472a; color: white; }
        .btn-secondary { background: #e5e7eb; color: #1f2937; }
        
        .map-preview {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
        }
        
        .map-preview h3 { margin-bottom: 1rem; }
        #mapPreview {
            height: 400px;
            border-radius: 12px;
            background: #f3f4f6;
            z-index: 10;
        }
        
        @media (max-width: 768px) {
            .sidebar { width: 80px; }
            .sidebar .logo span, .sidebar nav a span { display: none; }
            .main-content { margin-left: 80px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo"><i class="fas fa-seedling"></i> <span>Agrisens</span></div>
        <nav>
            <a href="dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a>
            <a href="upload.html"><i class="fas fa-cloud-upload-alt"></i> <span>Upload</span></a>
            <a href="manage.html"><i class="fas fa-database"></i> <span>Management</span></a>
            <a href="peta_multispektral.html"><i class="fas fa-map"></i> <span>Map</span></a>
        </nav>
    </div>
    
    <div class="main-content">
        <div class="header">
            <h1><i class="fas fa-tachometer-alt"></i> Dashboard</h1>
            <div class="user-info">
                <i class="fas fa-user-circle"></i>
                <span id="userName">User</span>
                <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
        
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><h3>Total Rice Parcels</h3><div class="value" id="totalParcels">-</div></div>
            <div class="stat-card"><h3>Total Area (ha)</h3><div class="value" id="totalArea">-</div></div>
            <div class="stat-card"><h3>Healthy Land</h3><div class="value" id="healthyPercent">-</div></div>
            <div class="stat-card"><h3>Last Update</h3><div class="value" id="lastUpdate">-</div></div>
        </div>
        
        <div class="action-buttons">
            <a href="/upload.html" class="btn btn-primary"><i class="fas fa-cloud-upload-alt"></i> Multispectral Upload</a>
            <a href="/manage.html" class="btn btn-secondary"><i class="fas fa-database"></i> Data Management</a>
            <a href="/peta_multispektral.html" class="btn btn-secondary"><i class="fas fa-map"></i> View Map</a>
        </div>
        
        <div class="map-preview">
            <h3><i class="fas fa-map-marked-alt"></i> Latest Map</h3>
            <div id="mapPreview"></div>
            <div style="margin-top: 10px; text-align: right;">
                <a href="/peta_multispektral.html" style="color: #2d6a4f; font-weight: 600; font-size: 14px; text-decoration: none;">
                    View details on the map page <i class="fas fa-arrow-right"></i>
                </a>
            </div>
        </div>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_URL = '';
        const token = localStorage.getItem('token');
        
        if (!token) { window.location.href = '/index.html'; }
        
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        document.getElementById('userName').innerText = user.full_name || user.username || 'User';
        
        // Initialize Map
        var map = L.map('mapPreview', { maxZoom: 23 }).setView([-7.275, 112.794], 15);
        L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 23, maxNativeZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);
        var currentOverlay = null;

        async function logout() {
            try {
                await fetch(`/api/auth/logout?token=${token}`, { method: 'POST' });
            } catch(e) {}
            
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/index.html';
        }
        
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();
                
                document.getElementById('totalParcels').innerText = stats.total_parcels || 0;
                document.getElementById('totalArea').innerText = stats.total_area?.toFixed(4) || "0.0000";
                document.getElementById('healthyPercent').innerText = (stats.healthy_percent || 0) + '%';
                
                if (stats.last_update) {
                    const date = new Date(stats.last_update);
                    document.getElementById('lastUpdate').innerText = date.toLocaleString('id-ID', {
                        day: '2-digit', month: '2-digit', year: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    });
                } else {
                    document.getElementById('lastUpdate').innerText = '-';
                }

                // Update Map
                if (stats.latest_map && stats.latest_map.layers && stats.latest_map.layers.rgb) {
                    const rgb = stats.latest_map.layers.rgb;
                    
                    if (rgb.has_tiles && rgb.tiles_url) {
                        const tileUrl = rgb.tiles_url.startsWith('http') ? rgb.tiles_url : API_URL + rgb.tiles_url;
                        if (!currentOverlay || currentOverlay._url !== tileUrl) {
                            if (currentOverlay) map.removeLayer(currentOverlay);
                            currentOverlay = L.tileLayer(tileUrl, { maxZoom: 23, maxNativeZoom: 20 }).addTo(map);
                            map.fitBounds(rgb.bounds);
                        }
                    } else {
                        const url = rgb.url.startsWith('http') ? rgb.url : API_URL + rgb.url;
                        if (!currentOverlay || currentOverlay._url !== url) {
                            if (currentOverlay) map.removeLayer(currentOverlay);
                            currentOverlay = L.imageOverlay(url, rgb.bounds).addTo(map);
                            map.fitBounds(rgb.bounds);
                        }
                    }
                }
            } catch(e) { console.error(e); }
        }
        
        loadStats();
        setInterval(loadStats, 10000);
    </script>
</body>
</html>
